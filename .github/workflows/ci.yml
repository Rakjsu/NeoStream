name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run so a CVE disclosed against an unchanged dependency is caught
  # even without a PR (the audit step fails the build on HIGH+ runtime vulns).
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  # 🐧 Windows E Linux (D146): o app sai para os três sistemas (matriz do
  # release.yml), mas até aqui o PR só era verificado no Windows. No NTFS um
  # import com a caixa errada ('./Foo' para foo.ts) e um caminho montado com
  # barra invertida na mão passam; no Linux quebram. Fora do Windows só
  # compilava o build.yml, que dispara DEPOIS do merge, e a suíte só rodava no
  # Linux no portão da release: o erro chegava à main e aparecia na hora de
  # tagar. O Linux basta para a classe "caixa alta" (o APFS do macOS, como o
  # NTFS, não diferencia caixa por padrão). O e2e segue só no Windows.
  # electron/ciAntesDoMergeNoLinux.test.ts amarra este contrato.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # Cada sistema dá o seu veredito: com o padrão (fail-fast), o Linux
      # vermelho cancelaria o Windows no meio e o PR ficaria sem saber se o
      # problema é só de um deles.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || (sleep 15 && npm ci) || (sleep 60 && npm ci)

      # Fail the build on HIGH+ vulnerabilities in PRODUCTION deps only, so a
      # new runtime CVE is caught early without dev-tooling advisories (vite/
      # esbuild dev-server file reads, etc.) blocking every PR.
      # O gate roda por um script com allowlist explícita (scripts/audit-prod.mjs)
      # para poder ignorar advisories que comprovadamente não se aplicam ao app
      # (ex.: react-router modo RSC, que este SPA não usa) sem afrouxar o resto.
      # A árvore de produção é a mesma nos dois sistemas: auditar uma vez basta
      # (e não dobra a chance de um soluço de rede no registry pintar o PR).
      - name: Audit production dependencies
        if: matrix.os == 'windows-latest'
        run: node scripts/audit-prod.mjs

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npx eslint src electron

      - name: Unit tests
        run: npx vitest run

      - name: Renderer + main build
        run: npx vite build

      - name: Bundle guard (ffmpeg-static inline mata DVR/transcode)
        run: node scripts/check-bundle.mjs

  # Separate job so the fast checks above are never blocked by app startup
  # times. Electron E2E needs no Playwright browser download — the suite
  # launches the Electron binary from node_modules directly.
  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || (sleep 15 && npm ci) || (sleep 60 && npm ci)

      - name: Build app (renderer + main)
        run: npx vite build
        env:
          # Chave TMDB fake SO pro build de E2E: sem chave, todo teste que
          # adiciona playlist cai no redirect de onboarding (Configuracoes ->
          # APIs) e a saudacao do dashboard so aparece por um frame - flaky
          # que depende da velocidade do runner. O spec do onboarding continua
          # cobrindo o fluxo sem chave via neostream_tmdb_ignore_env.
          VITE_TMDB_API_KEY: e2e-dummy-key

      - name: Bundle guard
        run: node scripts/check-bundle.mjs

      - name: E2E tests (Playwright + Electron)
        run: npx playwright test

      - name: Upload app screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: ignore

      # 🖼️ A regressão visual (#D145) mora no próprio Playwright: o
      # e2e/screenshots.spec.ts compara cada tela com e2e/baselines via
      # toHaveScreenshot e REPROVA o job. Expected/actual/diff de uma tela que
      # mudou vão no relatório HTML abaixo. (O passo antigo era um bash com o
      # compare do ImageMagick: saía 1 em todo run sem gerar um único diff, e
      # o continue-on-error escondia.)
      #
      # O relatório HTML importa MAIS quando o job passa: com `retries: 1` o
      # teste que é moeda falha, repete, passa — e só o HTML guarda o
      # error-context da tentativa perdida. Com `if: failure()` esse era
      # justamente o único caso sem artefato (foi assim que o trayRestore
      # sobreviveu semanas se passando por "flaky").
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          # Tem que ser a mesma pasta do reporter html do playwright.config.ts:
          # é esse par que faz o relatório chegar ao artefato (electron/
          # rastroDoE2eInstavel.test.ts amarra as duas pontas).
          path: playwright-report/
          retention-days: 7
          # Rodando sempre, o passo também pega o job que morreu antes do
          # Playwright (npm ci, vite build): sem isto o upload vazio vira aviso
          # amarelo — mesmo motivo do upload das screenshots acima.
          if-no-files-found: ignore
