# 🤖 Atualização automática de dependências (item 64 do backlog).
# Dependabot nativo do GitHub — mesmo papel do Renovate, sem app externo.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ⛔ TypeScript travado no 6.0.x até o typescript-eslint ESTÁVEL aceitar
      # a próxima versão. O peer dele é `>=4.8.4 <6.1.0` — subir o TS sozinho
      # faz o `npm ci` do CI morrer com ERESOLVE, e o gate local NÃO pega
      # (node_modules velho resolve; só instalação limpa quebra). Já derrubou
      # a main DUAS vezes: v4.45.0 e 4.47.1.
      #
      # Cobre major E MINOR de propósito: o peer corta em 6.1, não em 7 —
      # travar só a major deixaria o 6.1.0 passar e quebrar exatamente igual.
      # Para destravar: conferir `npm view typescript-eslint peerDependencies`
      # e só então remover esta entrada.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
