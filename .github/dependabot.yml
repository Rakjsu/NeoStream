# 🤖 Atualização automática de dependências (item 64 do backlog).
# Dependabot nativo do GitHub — mesmo papel do Renovate, sem app externo.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      minor-e-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ⛔ TypeScript major fica travado no 6.x até o typescript-eslint
      # ESTÁVEL aceitar a próxima major. O peer dele é `>=4.8.4 <6.1.0` —
      # subir o TS sozinho faz o `npm ci` do CI morrer com ERESOLVE, e o
      # gate local NÃO pega (node_modules velho resolve; só instalação
      # limpa quebra). Já derrubou a main DUAS vezes: v4.45.0 e 4.47.1.
      # Para destravar: conferir `npm view typescript-eslint peerDependencies`
      # e só então remover esta entrada.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
